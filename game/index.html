<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run: Thanksgiving Escape</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b1d12; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #wrap { position: relative; }
  canvas { display: block; background: #7a9b4e; border: 4px solid #5b3a1e; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #hint { position: absolute; left: 0; right: 0; bottom: -28px; text-align: center; color: #e8c98a; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">WASD / arrows to run &middot; SPACE or click to dash &middot; grab corn, dodge the farmer, reach the gate</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
